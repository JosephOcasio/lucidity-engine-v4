name: Round 6.3 Acquire Provenance
on:
  push:
    branches: [round6-3-target-resolution]
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install requests numpy pandas rasterio shapely
      - run: python round6_3/acquire_and_analyze.py
      - uses: actions/upload-artifact@v4
        with:
          name: ACE_HCR_Round6_3_Provenance
          path: round6_3_output/
          if-no-files-found: error
          retention-days: 30
